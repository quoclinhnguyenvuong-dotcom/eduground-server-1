<!-- File: web/messages.html -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tin nhắn — Eduground Cam</title>
<link rel="icon" href="assets/logo.png" />
<style>
  :root{
    --blue:#0078d7; --bg:#f5f8fb; --muted:#667; --panel:#fff;
  }
  *{box-sizing:border-box}
  body{font-family: Roboto, "Segoe UI", Arial, sans-serif; margin:0; background:var(--bg); color:#122;}
  .nav{background:var(--blue); color:#fff; padding:10px 16px; display:flex; align-items:center; justify-content:space-between;}
  .nav .left{display:flex;align-items:center;gap:18px}
  .nav .left img{height:34px; cursor:pointer}
  .nav a{color:#fff; text-decoration:none; margin-right:12px; font-weight:600}
  .nav .user{background:rgba(255,255,255,0.08); padding:6px 10px; border-radius:18px; display:flex; gap:8px; align-items:center}
  .nav .user img{width:32px;height:32px;border-radius:50%;object-fit:cover}
  .layout{display:flex; height:calc(100vh - 56px); overflow:hidden}
  .sidebar{width:320px; background:#fff; border-right:1px solid #e6eef7; display:flex; flex-direction:column}
  .search{padding:12px; display:flex; gap:8px; border-bottom:1px solid #f0f4f9}
  .search input{flex:1;padding:9px;border-radius:8px;border:1px solid #dbeaf7}
  .search button{width:40px;border:none;background:var(--blue);color:#fff;border-radius:8px;cursor:pointer}
  .chat-list{overflow:auto;flex:1;padding:8px}
  .chat-item{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;cursor:pointer}
  .chat-item:hover{background:#f6fbff}
  .chat-item .avatar{width:44px;height:44px;border-radius:50%;background:#ddd;flex:0 0 44px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
  .chat-item .meta{flex:1}
  .chat-item .meta .title{font-weight:700;color:var(--blue)}
  .chat-item .meta .sub{font-size:13px;color:var(--muted)}
  .main{flex:1;display:flex;flex-direction:column}
  .main .header{padding:14px;border-bottom:1px solid #f0f4f9;background:#fff;display:flex;align-items:center;justify-content:space-between}
  .main .body{flex:1; padding:12px; overflow:auto; background:#eef6fb; display:flex; flex-direction:column}
  .placeholder{margin:auto;color:#9aa; font-size:16px}
  .messages{max-width:920px;margin:8px auto; width:100%}
  .msg-row{display:flex; margin:8px 0}
  .msg-row.me{justify-content:flex-end}
  .bubble{padding:10px 14px;border-radius:14px;max-width:70%; word-wrap:break-word; background:#fff; border:1px solid #e6eef7}
  .bubble.me{background:var(--blue); color:#fff; border:0}
  .meta-small{font-size:11px;color:#667;margin-top:6px}
  .footer{padding:12px;border-top:1px solid #e6eef7;background:#fff;display:flex;gap:8px;align-items:center}
  .footer input[type="text"]{flex:1;padding:10px;border-radius:20px;border:1px solid #dbeaf7}
  .footer .btn{background:var(--blue);color:#fff;padding:8px 12px;border-radius:12px;border:none;cursor:pointer}
  .small-muted{font-size:12px;color:#777}
  /* modal */
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);align-items:center;justify-content:center}
  #modal .box{background:#fff;padding:18px;border-radius:10px;width:360px}
  /* responsive */
  @media(max-width:900px){
    .sidebar{width:220px}
    .bubble{max-width:86%}
  }
</style>
</head>
<body>
  <div class="nav">
    <div class="left">
      <img src="assets/logo_index.png" alt="logo" onclick="location.href='index.html'">
      <a href="index.html">Trang chủ</a>
      <a href="messages.html">Tin nhắn</a>
      <a href="reminder.html">Reminder</a>
      <a href="soday.html">Sổ đầu bài</a>
      <a href="chatbot.html">Chatbot</a>
      <a href="meeting.html">Meeting</a>
      <a href="login.html" id="logoutLink">Đăng xuất</a>
    </div>
    <div class="user" id="userBar">
      <div id="welcomeText">Chào mừng, <b id="userLabel">Khách</b></div>
      <img src="assets/avatar.png" alt="avatar" id="userAv">
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="search">
        <input id="searchBox" placeholder="Tìm kiếm..." />
        <button id="newBtn" title="Tạo nhóm">+</button>
      </div>
      <div class="chat-list" id="chatList">
        <!-- Danh sách nhóm / dm -->
      </div>
    </div>

    <div class="main">
      <div class="header">
        <div id="chatTitle">Chưa chọn đoạn chat</div>
        <div>
          <button id="manageBtn" class="btn" style="display:none">Quản lý</button>
          <button id="debugBtn" class="btn" style="display:none;background:#444;margin-left:8px">Dev</button>
        </div>
      </div>

      <div class="body" id="mainBody">
        <div class="placeholder" id="placeholder">Chọn đoạn chat để xem tin nhắn</div>
        <div class="messages" id="messagesArea" style="display:none"></div>
      </div>

      <div class="footer">
        <input id="msgInput" placeholder="Nhập tin nhắn..." type="text" onkeydown="if(event.key==='Enter') sendMessage()">
        <input id="mediaInput" type="file" accept="image/*,video/*" style="display:none">
        <button class="btn" id="mediaBtn">+ media</button>
        <button class="btn" id="sendBtn">Gửi</button>
      </div>
    </div>
  </div>

  <!-- modal create group -->
  <div id="modal">
    <div class="box">
      <h3>Tạo nhóm</h3>
      <input id="gName" placeholder="Tên nhóm" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px">
      <div style="height:8px"></div>
      <input id="gMembers" placeholder="Thành viên (phân tách bằng ,)" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px">
      <div style="height:12px"></div>
      <div style="text-align:right">
        <button class="btn" id="createGroupBtn">Tạo</button>
        <button style="margin-left:8px" id="cancelGroupBtn">Huỷ</button>
      </div>
    </div>
  </div>

<script>
/* ====== CẤU HÌNH ====== */
const API_BASE = ''; // nếu chạy cùng host (ví dụ: https://your-render-service/) -> leave empty to use relative paths
const API_MESSAGES = API_BASE + '/messages';
const API_GROUPS = API_BASE + '/groups';

/* ====== NGƯỜI DÙNG & ROLE ====== */
const USER = sessionStorage.getItem('username') || localStorage.getItem('edu_remember') || 'Khách';
const ROLE = sessionStorage.getItem('role') || localStorage.getItem('role') || 'student';
document.getElementById('userLabel').textContent = USER;
document.getElementById('userAv').src = 'assets/avatar.png';

/* logout */
document.getElementById('logoutLink').addEventListener('click', (e)=>{
  localStorage.removeItem('edu_remember');
  sessionStorage.removeItem('username');
  sessionStorage.removeItem('role');
  // let the link do navigation
});

/* show manage / dev buttons by role */
if(ROLE !== 'student') document.getElementById('manageBtn').style.display = 'inline-block';
if(ROLE === 'admin') document.getElementById('debugBtn').style.display = 'inline-block';

/* ====== UI ELEMENTS ====== */
const chatListEl = document.getElementById('chatList');
const messagesArea = document.getElementById('messagesArea');
const placeholder = document.getElementById('placeholder');
const chatTitle = document.getElementById('chatTitle');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const mediaBtn = document.getElementById('mediaBtn');
const mediaInput = document.getElementById('mediaInput');
const modal = document.getElementById('modal');

let activeChatId = null;
let activeChatMeta = null;
let pollTimer = null;
let shownKeys = new Set();
let pendingMedia = null;

/* ====== HELPERS ====== */
function escapeHtml(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatTime(ts){ try { return new Date(ts).toLocaleString(); } catch(e){ return ''; } }

/* ====== LOAD GROUPS (và local DMs) ====== */
async function loadList(q=''){
  chatListEl.innerHTML = '';
  // fetch groups from API
  try{
    const r = await fetch(API_GROUPS);
    if(r.ok){
      const data = await r.json();
      // data expected to be object map of groups
      Object.keys(data || {}).forEach(k=>{
        const g = data[k];
        if(!g || !g.name) return;
        const name = g.name;
        const members = (g.members||[]).join(', ');
        if(q && !name.toLowerCase().includes(q) && !members.toLowerCase().includes(q)) return;
        const div = renderChatItem(k, name, members, true);
        chatListEl.appendChild(div);
      });
    }
  }catch(err){
    console.warn('Không lấy được groups:', err);
  }

  // show local DMs stored in localStorage
  const dms = JSON.parse(localStorage.getItem('local_dms')||'[]');
  dms.forEach(dm=>{
    const id = 'dm:'+dm;
    if(q && !dm.toLowerCase().includes(q)) return;
    const div = renderChatItem(id, dm, 'Tin nhắn riêng', false);
    chatListEl.appendChild(div);
  });

  // if empty show hint
  if(!chatListEl.firstChild){
    chatListEl.innerHTML = '<div style="padding:12px;color:#999">Không có đoạn chat. Tạo nhóm hoặc nhắn trực tiếp.</div>';
  }
}

function renderChatItem(id, title, sub, isGroup){
  const div = document.createElement('div');
  div.className = 'chat-item';
  div.onclick = ()=> openChat(id, {name:title, members: sub, isGroup});
  div.innerHTML = `
    <div class="avatar">${escapeHtml((title||'')[0]||'U')}</div>
    <div class="meta">
      <div class="title">${escapeHtml(title)}</div>
      <div class="sub">${escapeHtml(sub)}</div>
    </div>
  `;
  return div;
}

/* ====== OPEN CHAT ====== */
function openChat(id, meta){
  stopPolling();
  activeChatId = id;
  activeChatMeta = meta || {};
  chatTitle.textContent = meta.name || id;
  placeholder.style.display = 'none';
  messagesArea.style.display = 'block';
  messagesArea.innerHTML = '';
  shownKeys.clear();
  // if DM -> ensure saved in local_dms
  if(id.startsWith('dm:')){
    const peer = id.split(':')[1];
    let dms = JSON.parse(localStorage.getItem('local_dms')||'[]');
    if(!dms.includes(peer)){ dms.push(peer); localStorage.setItem('local_dms', JSON.stringify(dms)); loadList(); }
    // load local messages
    const key = 'dm_'+[peer,USER].sort().join('_');
    const msgs = JSON.parse(localStorage.getItem(key)||'[]');
    msgs.forEach(m=> addMsgToUI(m));
    startPolling(); // still poll server DM room too
  } else {
    // fetch group messages then start polling
    startPolling();
  }
}

/* ====== POLLING ====== */
async function pollOnce(){
  if(!activeChatId) return;
  try{
    const r = await fetch(API_MESSAGES);
    if(!r.ok) return;
    const data = await r.json(); // expected map by chat_id
    const all = data || {};
    // For DM: we used local key + also server rooms named like dmroom_peer_user maybe — but server stores by chat_id, front uses chat ids we choose.
    if(activeChatId.startsWith('dm:')){
      // we will also try to read server key 'dmroom_peer_user'
      const peer = activeChatId.split(':')[1];
      const room = 'dmroom_' + [peer,USER].sort().join('_');
      const msgs = all[room] || [];
      msgs.forEach(m=> addMsgToUI(m));
    } else {
      const msgs = all[activeChatId] || [];
      msgs.forEach(m=> addMsgToUI(m));
    }
  }catch(err){
    console.warn('poll error', err);
  }
}

function startPolling(){
  pollOnce();
  pollTimer = setInterval(pollOnce, 2000);
}
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

/* ====== ADD MESSAGE TO UI ====== */
function addMsgToUI(m){
  // compute unique key
  const key = m._id || (m.from+'|'+m.time+'|'+(m.text||m.data||''));
  if(shownKeys.has(key)) return;
  shownKeys.add(key);

  const row = document.createElement('div');
  row.className = 'msg-row ' + ((m.from === USER)? 'me':'');
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + ((m.from === USER)? 'me':'');

  if(m.type === 'media'){
    // if we get a data url - show image; otherwise show link
    if(m.data && m.mediaType && m.mediaType.startsWith('image') && m.data.startsWith('data:')){
      bubble.innerHTML = `<img src="${m.data}" style="max-width:320px;border-radius:8px;display:block">`;
    } else if(m.data && typeof m.data === 'string'){
      bubble.innerHTML = `<div>[Media] <a href="${m.data}" target="_blank">Mở file</a></div>`;
    } else {
      bubble.innerHTML = `<div>[Media] Coming soon</div>`;
    }
  } else {
    bubble.innerHTML = `<div>${escapeHtml(m.text||'')}</div>`;
  }

  const meta = document.createElement('div');
  meta.className = 'meta-small';
  meta.textContent = `${formatTime(m.time||Date.now())} — ${m.from||'?'}`;
  bubble.appendChild(meta);

  row.appendChild(bubble);
  messagesArea.appendChild(row);
  messagesArea.scrollTop = messagesArea.scrollHeight;
}

/* ====== SENDING MESSAGE ====== */
async function sendMessage(){
  const text = msgInput.value.trim();
  if(!text && !pendingMedia) return;
  if(!activeChatId){ alert('Chưa chọn đoạn chat'); return; }

  // build payload
  const payload = {
    chat_id: activeChatId,
    from: USER,
    time: Date.now(),
    type: pendingMedia? 'media' : 'text'
  };
  if(pendingMedia){
    // currently we send DataURL as data (note: not ideal for big files) — or send placeholder link
    payload.data = pendingMedia.data; // base64 dataURL
    payload.mediaType = pendingMedia.mediaType;
  } else {
    payload.text = text;
  }

  // optimistic UI: show a temporary "pending" entry
  const temp = {...payload, _id: 'tmp_'+Math.random().toString(36).slice(2), pending:true};
  addMsgToUI(temp);
  msgInput.value = '';
  pendingMedia = null;
  document.getElementById('mediaBtn').textContent = '+ media';

  // POST to server
  try{
    const r = await fetch(API_MESSAGES, {
      method:'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!r.ok){
      // mark failure
      alert('Gửi không thành công (server). Tin được lưu cục bộ.');
      // fallback: store locally
      fallbackLocalSave(payload);
    } else {
      // good: server saved. optionally update UI by re-polling or just leave optimistic entry.
      // doing one immediate poll to get canonical data from server
      setTimeout(()=>pollOnce(), 400);
    }
  }catch(err){
    console.warn('send error', err);
    alert('Lỗi kết nối — đã lưu cục bộ.');
    fallbackLocalSave(payload);
  }
}

/* fallback: lưu local DM or local_chat_... */
function fallbackLocalSave(payload){
  if(activeChatId.startsWith('dm:')){
    const peer = activeChatId.split(':')[1];
    const key = 'dm_'+[peer,USER].sort().join('_');
    const arr = JSON.parse(localStorage.getItem(key)||'[]');
    arr.push(payload);
    localStorage.setItem(key, JSON.stringify(arr));
  } else {
    const localKey = 'local_chat_'+activeChatId;
    const arr = JSON.parse(localStorage.getItem(localKey)||'[]');
    arr.push(payload);
    localStorage.setItem(localKey, JSON.stringify(arr));
  }
}

/* ====== MEDIA INPUT ====== */
mediaBtn.addEventListener('click', ()=> mediaInput.click());
mediaInput.addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  if(f.size > 3*1024*1024 && !confirm('File lớn hơn 3MB — gửi có thể chậm. Tiếp tục?')){ e.target.value=''; return;}
  const reader = new FileReader();
  reader.onload = function(ev){
    pendingMedia = { data: ev.target.result, mediaType: f.type };
    mediaBtn.textContent = '📎 (1)';
  };
  reader.readAsDataURL(f);
});

/* ====== CREATE GROUP (modal) ====== */
document.getElementById('newBtn').addEventListener('click', ()=> { modal.style.display = 'flex'; });
document.getElementById('cancelGroupBtn').addEventListener('click', ()=> { modal.style.display='none'; });
document.getElementById('createGroupBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('gName').value.trim();
  const members = (document.getElementById('gMembers').value || '').split(',').map(s=>s.trim()).filter(Boolean);
  if(!name) { alert('Nhập tên nhóm'); return; }
  const id = 'grp_' + name.replace(/\s+/g,'_') + '_' + Math.random().toString(36,8);
  const obj = { id, name, members, createdBy: USER, roles:{owner:USER, admins:[]}, muted:{} };
  // POST to API
  try{
    const r = await fetch(API_GROUPS, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj) });
    if(!r.ok){ alert('Tạo nhóm thất bại (server). Lưu local.'); // fallback local
      let local = JSON.parse(localStorage.getItem('local_groups')||'[]'); local.push(obj); localStorage.setItem('local_groups', JSON.stringify(local));
    } else {
      // success -> reload list
      setTimeout(()=> loadList(), 600);
    }
  }catch(err){
    console.warn('create group error', err);
    let local = JSON.parse(localStorage.getItem('local_groups')||'[]'); local.push(obj); localStorage.setItem('local_groups', JSON.stringify(local));
  }
  modal.style.display='none';
});

/* ====== SEARCH ====== */
document.getElementById('searchBox').addEventListener('input', function(){
  loadList(this.value.trim().toLowerCase());
});

/* ====== GROUP MANAGEMENT (simple) ====== */
document.getElementById('manageBtn').addEventListener('click', ()=>{
  if(!activeChatId || activeChatId.startsWith('dm:')) return alert('Chọn nhóm để quản lý.');
  const cmd = prompt('Lệnh (members / kick:username / addadmin:username / removeadmin:username):');
  if(!cmd) return;
  // Very lightweight: we will PUT updated object by reading groups (can't PUT since API store uses map keys)
  // For now we will just show instructions to admin (requires backend improvements)
  alert('Yêu cầu đã gửi (hiện tại backend cần endpoint bổ sung để xử lý quyền).');
});

/* debug button for admin */
document.getElementById('debugBtn').addEventListener('click', ()=> {
  const dump = {
    user:USER, role:ROLE, active: activeChatId,
    local_dms: JSON.parse(localStorage.getItem('local_dms')||'[]'),
    local_groups: JSON.parse(localStorage.getItem('local_groups')||'[]')
  };
  alert(JSON.stringify(dump, null, 2));
});

/* ====== INITIALIZE ====== */
(async function init(){
  if(!sessionStorage.getItem('username') && !localStorage.getItem('edu_remember')){
    // redirect to login
    window.location.href = 'login.html';
    return;
  }
  await loadList();
  // optional: auto open first group
  // try to auto-open first group from server
  try{
    const r = await fetch(API_GROUPS);
    if(r.ok){
      const data = await r.json();
      const keys = Object.keys(data || {});
      if(keys.length) openChat(keys[0], data[keys[0]]);
    }
  }catch(e){}
})();
</script>
</body>
</html>
