<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập | Eduground</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{font-family:"Noto Sans",sans-serif;background:#e9f1fa;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
  .login-box{background:#fff;padding:30px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,0.08);width:320px}
  h2{text-align:center;color:#0078d7}
  input,button{width:100%;padding:10px;margin:6px 0;border:1px solid #cfdbe9;border-radius:6px}
  button{background:#0078d7;color:#fff;border:none;font-weight:600;cursor:pointer}
  button:hover{background:#005bb5}
  .remember{display:flex;align-items:center;gap:6px;font-size:14px}
  .error{color:red;text-align:center;margin-top:6px}
</style>
</head>

<body>
  <div class="login-box">
    <h2>Đăng nhập Eduground</h2>
    <input id="username" placeholder="Tên đăng nhập">
    <input id="password" type="password" placeholder="Mật khẩu">
    <div class="remember">
      <input type="checkbox" id="remember"> <label for="remember">Ghi nhớ tôi</label>
    </div>
    <button onclick="login()">Đăng nhập</button>
    <div id="error" class="error"></div>
  </div>

<script>
async function login(){
  const u=document.getElementById("username").value.trim();
  const p=document.getElementById("password").value.trim();
  const remember=document.getElementById("remember").checked;
  const err=document.getElementById("error");
  err.textContent="";

  if(!u||!p){err.textContent="⚠️ Vui lòng nhập đầy đủ thông tin";return;}

  try{
    const res=await fetch("accounts.json");
    const accs=await res.json();

    if(accs[u] && accs[u].password===p){
      sessionStorage.setItem("username",u);
      sessionStorage.setItem("role",accs[u].role);
      if(remember){
        localStorage.setItem("username",u);
        localStorage.setItem("role",accs[u].role);
      }
      window.location.href="index.html";
    }else{
      err.textContent="❌ Sai tên đăng nhập hoặc mật khẩu";
    }
  }catch(e){
    err.textContent="⚠️ Không thể đọc file accounts.json";
  }
}

// Tự đăng nhập lại nếu có dữ liệu trong localStorage
window.onload=function(){
  const u=localStorage.getItem("username");
  const r=localStorage.getItem("role");
  if(u && r){
    sessionStorage.setItem("username",u);
    sessionStorage.setItem("role",r);
    window.location.href="chatbot.html";
  }
};
</script>
</body>
</html>
