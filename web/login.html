<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - EduGround</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-container">
    <h1>Đăng nhập hệ thống</h1>

    <div class="form-group">
      <label>Tên đăng nhập:</label>
      <input type="text" id="username" placeholder="Nhập tên..." />
    </div>

    <div class="form-group">
      <label>Mật khẩu:</label>
      <input type="password" id="password" placeholder="••••••" />
    </div>

    <div class="form-group remember">
      <label><input type="checkbox" id="remember" /> Ghi nhớ đăng nhập</label>
    </div>

    <button onclick="doLogin()">Đăng nhập</button>

    <p id="msg" style="color:red;margin-top:10px"></p>
  </div>

  <!-- ✅ Luôn để script ở cuối body -->
  <script src="js/auth.js"></script>
</body>
</html>
