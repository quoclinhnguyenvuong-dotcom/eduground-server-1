<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🤖 Chatbot Eduground</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">

<style>
  body{font-family:"Noto Sans",system-ui;background:#f0f6fb;margin:0}
  .nav{background:#0078d7;color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between}
  .nav a{color:#fff;margin:0 8px;text-decoration:none}
  .container{max-width:900px;margin:28px auto;padding:18px;background:#fff;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,0.06)}
  #chatbox{height:460px;border:1px solid #e6eef7;border-radius:8px;padding:12px;overflow:auto;background:#fcfeff}
  .msg{padding:10px 12px;border-radius:10px;max-width:78%;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
  .bot{background:#eef6fb;color:#0b2540}
  .user{background:#0078d7;color:#fff;margin-left:auto;text-align:right}
  .row{display:flex;gap:8px;margin-top:12px}
  input[type=text]{flex:1;padding:10px;border-radius:8px;border:1px solid #cfdbe9}
  button{background:#0078d7;color:#fff;padding:10px 12px;border:none;border-radius:8px;cursor:pointer}
  button:hover{background:#005bb5}
</style>
</head>

<body>
  <div class="nav">
    <div><img src="assets/logo_index.png" style="height:36px;cursor:pointer" onclick="location.href='index.html'"></div>
    <div>
      <a href="index.html">Trang chủ</a>
      <a href="messages.html">Tin nhắn</a>
      <a href="reminders.html">Reminder</a>
      <a href="chatbot.html"><b>Chatbot</b></a>
      <a href="login.html" onclick="logout()">Đăng xuất</a>
    </div>
  </div>

  <div class="container">
    <h1 id="welcome">🤖 Chatbot Eduground</h1>
    <div id="chatbox">
      <div class="msg bot" id="intro"></div>
    </div>

    <div class="row">
      <input id="userInput" placeholder="Nhập câu hỏi của bạn..." />
      <button id="sendBtn">Gửi</button>
    </div>
  </div>

<!-- Chatbot logic -->
<script type="module">
import { InferenceClient } from "https://cdn.jsdelivr.net/npm/@huggingface/inference@2.6.0/+esm";

// ⚠️ Token của bạn (chỉ dùng local)
const HF_TOKEN = "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"; // ← Dán token thật vào đây
const MODEL = "MiniMaxAI/MiniMax-M2"; // hoặc model free khác của HuggingFace

const client = new InferenceClient(HF_TOKEN);

const USER = sessionStorage.getItem('username') || localStorage.getItem('edu_remember') || 'Khách';
document.getElementById('welcome').innerHTML = `🤖 Chatbot Eduground`;
document.getElementById('intro').innerHTML = `Xin chào, <b>${USER}</b> 👋<br>Mình là trợ lý học tập Eduground, có thể giúp bạn hiểu bài, tóm tắt kiến thức hoặc luyện tập.`;

// Elements
const chatbox = document.getElementById("chatbox");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
  sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") sendMessage(); });

async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;
  appendMessage("user", text);
  appendMessage("bot", "⏳ Đang suy nghĩ...");
  input.value = "";
  chatbox.scrollTop = chatbox.scrollHeight;

  try {
    const response = await client.textGeneration({
      model: MODEL,
      inputs: text,
      parameters: {
        temperature: 0.7,
        max_new_tokens: 400,
      }
    });

    const reply = response.generated_text || "Không có phản hồi.";
    replaceLastBotMessage(reply);
  } catch (err) {
    replaceLastBotMessage("❌ Lỗi: " + err.message);
  }
}

function appendMessage(role, text){
  const msg = document.createElement("div");
  msg.className = "msg " + (role === "user" ? "user" : "bot");
  msg.textContent = text;
  chatbox.appendChild(msg);
  chatbox.scrollTop = chatbox.scrollHeight;
}

function replaceLastBotMessage(newText){
  const bots = chatbox.querySelectorAll(".msg.bot");
  if(bots.length > 0){
    bots[bots.length - 1].textContent = newText;
  }
  chatbox.scrollTop = chatbox.scrollHeight;
}

function logout(){
  sessionStorage.clear();
  localStorage.clear();
  location.href='login.html';
}
</script>
</body>
</html>
