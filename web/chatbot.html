<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chatbot Eduground</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--blue:#0078d7;--bg:#f4f8fc;--card:#fff}
  body{font-family:"Noto Sans",system-ui,Arial;background:var(--bg);margin:0;color:#122}
  .nav{background:var(--blue);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
  .nav a{color:#fff;margin-left:12px;text-decoration:none}
  .wrap{max-width:900px;margin:24px auto;padding:18px;background:var(--card);border-radius:10px;box-shadow:0 8px 30px rgba(13,40,70,0.06)}
  #chatbox{height:500px;border:1px solid #e7f0fa;border-radius:8px;padding:12px;overflow:auto;background:#fcfeff}
  .msg{padding:10px 12px;border-radius:10px;max-width:78%;margin:8px 0;white-space:pre-wrap}
  .msg.bot{background:#eef6fb;color:#07304a}
  .msg.me{background:var(--blue);color:#fff;margin-left:auto;text-align:right}
  .row{display:flex;gap:8px;margin-top:12px}
  input[type=text]{flex:1;padding:10px;border-radius:8px;border:1px solid #cddce8}
  button{background:var(--blue);color:#fff;padding:10px 14px;border:none;border-radius:8px;cursor:pointer}
  .status{margin-top:10px;color:#666;font-size:0.9rem}
</style>
</head>
<body>
  <div class="nav">
    <div>
      <a href="index.html"><strong>Eduground</strong></a>
      <a href="messages.html">Tin nhắn</a>
      <a href="reminders.html">Reminder</a>
      <a href="chatbot.html"><b>Chatbot</b></a>
    </div>
  </div>

  <div class="wrap">
    <h2>🤖 Chatbot trợ lý học tập (HF)</h2>
    <div id="chatbox"><div class="msg bot">Xin chào 👋! Mình là Chatbot Eduground. Bạn có thể hỏi mình về bài học, công thức, hay khái niệm.</div></div>
    <div class="row">
      <input id="input" placeholder="Nhập câu hỏi của bạn...">
      <button id="sendBtn">Gửi</button>
    </div>
    <div class="status" id="status"></div>
  </div>

<script>
/* ================= CONFIG ================== */
// ⚠️ GẮN TOKEN HF TRỰC TIẾP Ở ĐÂY
const OPENROUTER_API   = "https://openrouter.ai/api/v1/chat/completions"; // <-- dán API token HuggingFace của mày
const OPENROUTER_KEY = "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"; // hoặc model khác
const MODEL = "tngtech/deepseek-r1t2-chimera:free";
/* =========================================== */

const chatbox = document.getElementById("chatbox");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusEl = document.getElementById("status");

let convo = [];

function appendMessage(text, who='bot'){
  const div = document.createElement('div');
  div.className = 'msg ' + (who==='me'?'me':'bot');
  div.innerHTML = text;
  chatbox.appendChild(div);
  chatbox.scrollTop = chatbox.scrollHeight;
}

function setStatus(s){ statusEl.textContent = s; }async function callHF(prompt){
  setStatus("⏳ Đang gọi model...");
  const sys = "Bạn là trợ lý học tập tiếng Việt. Giải thích, hướng dẫn và hiển thị công thức bằng LaTeX nếu có thể.";
  let context = sys + "\n\n";
  convo.slice(-6).forEach(m=>{
    context += (m.role==='user'?"Học sinh: ":"Trợ lý: ") + m.text + "\n";
  });
  context += "Học sinh: " + prompt + "\nTrợ lý:";

  const r = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${HF_TOKEN}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      inputs: context,
      parameters: { max_new_tokens: 300, temperature: 0.5 }
    })
  });

  if(!r.ok){
    throw new Error(`HF API lỗi: ${r.status} ${r.statusText}`);
  }

  const data = await r.json();
  let reply = "";
  if(Array.isArray(data) && data[0]?.generated_text) reply = data[0].generated_text;
  else if(data.generated_text) reply = data.generated_text;
  else reply = JSON.stringify(data);

  setStatus("✅ Đã nhận phản hồi");
  return reply.trim();
}

async function sendMsg(){
  const text = input.value.trim();
  if(!text) return;
  appendMessage(text, 'me');
  convo.push({role:'user', text});
  input.value = "";
  try{
    const reply = await callHF(text);
    appendMessage(reply, 'bot');
    convo.push({role:'assistant', text:reply});
  }catch(e){
    appendMessage("⚠️ " + e.message, 'bot');
    setStatus("Lỗi: " + e.message);
  }
}

sendBtn.addEventListener("click", sendMsg);
input.addEventListener("keydown", e=>{ if(e.key==="Enter") sendMsg(); });
</script>
</body>
</html>
