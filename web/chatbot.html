<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chatbot Eduground</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:"Noto Sans",Segoe UI,Arial;background:#f0f6fb;margin:0}
  .nav{background:#0078d7;color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between}
  .nav a{color:#fff;margin:0 8px;text-decoration:none}
  .container{max-width:900px;margin:28px auto;padding:18px;background:#fff;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,0.06)}
  h1{color:#0078d7}
  #chatbox{height:420px;border:1px solid #e6eef7;border-radius:8px;padding:12px;overflow:auto;background:#fcfeff}
  .msg{padding:10px 12px;border-radius:10px;max-width:78%;margin-bottom:10px;white-space:pre-wrap}
  .bot{background:#eef6fb;color:#0b2540}
  .user{background:#0078d7;color:#fff;margin-left:auto;text-align:right}
  .row{display:flex;gap:8px;margin-top:12px}
  input[type=text]{flex:1;padding:10px;border-radius:8px;border:1px solid #cfdbe9}
  button{background:#0078d7;color:#fff;padding:10px 12px;border:none;border-radius:8px}
</style>
</head>
<body>
  <div class="nav">
    <div><img src="assets/logo_index.png" style="height:36px;cursor:pointer" onclick="location.href='index.html'"></div>
    <div>
      <a href="index.html">Trang chủ</a>
      <a href="messages.html">Tin nhắn</a>
      <a href="login.html">Đăng xuất</a>
    </div>
  </div>

  <div class="container">
    <h1>🤖 Chatbot Eduground</h1>
    <div id="chatbox" role="log" aria-live="polite">
      <div class="msg bot">Xin chào! Mình là trợ lý học tập Eduground. Bạn muốn hỏi gì nào?</div>
    </div>

    <div class="row">
      <input id="userInput" placeholder="Nhập câu hỏi của bạn...">
      <button id="sendBtn">Gửi</button>
    </div>
  </div>

<script>
const USER = sessionStorage.getItem('username') || 'Khách';
document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('userInput').addEventListener('keydown',(e)=>{ if(e.key==='Enter') sendMessage(); });

const API_URL = "https://openrouter.ai/api/v1/chat/completions";
const API_KEY = "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";
const MODEL = "tngtech/deepseek-r1t2-chimera:free";

async function sendMessage(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;
  const cb = document.getElementById('chatbox');

  // user message
  const u = document.createElement('div'); u.className='msg user'; u.textContent=text; cb.appendChild(u);

  // waiting
  const wait = document.createElement('div'); wait.className='msg bot'; wait.id='waiting'; wait.textContent='⏳ Đang chờ phản hồi từ máy chủ...'; cb.appendChild(wait);
  cb.scrollTop = cb.scrollHeight;
  input.value='';

  try{
    const r = await fetch(API_URL, {
      method:'POST',
      headers:{
        "Authorization": `Bearer ${API_KEY}`,
        "Content-Type":"application/json"
      },
      body: JSON.stringify({model:MODEL,messages:[{role:"user",content:text}]})
    });
    document.getElementById('waiting')?.remove();
    if(!r.ok){
      const er = document.createElement('div'); er.className='msg bot'; er.textContent=`❌ Lỗi phản hồi: ${r.status}`; cb.appendChild(er); cb.scrollTop = cb.scrollHeight; return;
    }
    const data = await r.json();
    const reply = data?.choices?.[0]?.message?.content || "Không có phản hồi.";
    const b = document.createElement('div'); b.className='msg bot'; b.textContent = reply; cb.appendChild(b);
  }catch(err){
    document.getElementById('waiting')?.remove();
    const e = document.createElement('div'); e.className='msg bot'; e.textContent = `⚠️ Lỗi kết nối: ${err.message}`; cb.appendChild(e);
  }
  cb.scrollTop = cb.scrollHeight;
}
</script>
</body>
</html>
