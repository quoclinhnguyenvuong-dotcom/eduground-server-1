<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot EduGround</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body { font-family: "Segoe UI"; background: #f0f9ff; margin: 0; }
    header {
      background: #2563eb; color: white;
      padding: 12px 20px; display: flex; justify-content: space-between;
      align-items: center;
    }
    nav a { color: white; margin: 0 8px; text-decoration: none; font-weight: 500; }
    #chat {
      width: 70%; margin: 30px auto; background: white;
      border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 20px;
    }
    .msg { margin: 8px 0; }
    .user { text-align: right; color: #1d4ed8; }
    .bot { color: #374151; }
    #input-area { display: flex; margin-top: 15px; }
    input {
      flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #ccc;
    }
    button {
      margin-left: 8px; background: #2563eb; color: white;
      border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <b>Eduground Cam</b> — Chatbot
      <nav>
        <a href="index.html">Trang chủ</a>
        <a href="messages.html">Tin nhắn</a>
        <a href="reminders.html">Reminder</a>
        <a href="chatbot.html">Chatbot</a>
        <a href="#" onclick="logout()">Đăng xuất</a>
      </nav>
    </div>
    <div id="welcome"></div>
  </header>

  <div id="chat">
    <h3>🤖 Chatbot Eduground</h3>
    <div id="chat-box"></div>
    <div id="input-area">
      <input type="text" id="msg" placeholder="Nhập câu hỏi..." />
      <button onclick="sendMsg()">Gửi</button>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("user") || "null");
    if (!user) location.href = "login.html";
    document.getElementById("welcome").textContent =
      `Chào mừng ${user.username}, chúc bạn một ngày vui vẻ 🥰`;

    const chatBox = document.getElementById("chat-box");
    const OPENROUTER_API = "https://openrouter.ai/api/v1/chat/completions";
    const API_KEY = "";

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    addMsg("Xin chào! Mình là trợ lý học tập Eduground. Bạn muốn hỏi gì nào?", "bot");

    async function sendMsg() {
      const input = document.getElementById("msg");
      const msg = input.value.trim();
      if (!msg) return;
      input.value = "";
      addMsg(`${user.username}: ${msg}`, "user");

      try {
        const res = await fetch(OPENROUTER_API, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [
              { role: "system", content: "Bạn là trợ lý học tập thân thiện Eduground." },
              { role: "user", content: msg }
            ]
          })
        });

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || "Mình chưa hiểu câu hỏi này 😅";
        addMsg(reply, "bot");
      } catch (e) {
        addMsg("Lỗi kết nối API 😢", "bot");
      }
    }

    function logout() {
      localStorage.removeItem("user");
      location.href = "login.html";
    }
  </script>
</body>
</html>
