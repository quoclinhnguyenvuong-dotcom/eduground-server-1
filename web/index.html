<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduGround - Trang chính</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    header {
      background: #3b82f6;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    #user-info {
      font-size: 0.9rem;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      color: #666;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>EduGround Dashboard</h1>
    <div id="user-info">
      Xin chào, <span id="user-name">...</span> (<span id="user-role">...</span>)
      <button class="logout-btn" onclick="logout()">Đăng xuất</button>
    </div>
  </header>

  <main>
    <h2>Chào mừng đến với hệ thống EduGround!</h2>
    <p>Chọn một tính năng bên dưới để bắt đầu:</p>
    <div style="margin-top: 2rem;">
      <a href="messages.html">💬 Tin nhắn nhóm</a> |
      <a href="reminders.html">🗓️ Nhắc nhở bài giảng</a> |
      <a href="chatbot.html">🤖 Trợ lý AI</a>
    </div>
  </main>

  <footer>
    © 2025 EduGround - Trường THCS Kỹ thuật số
  </footer>

  <script>
    // === Kiểm tra đăng nhập ===
    const user = JSON.parse(localStorage.getItem("user") || "null");

    if (!user) {
      // Nếu chưa login → quay về login.html
      window.location.href = "login.html";
    } else {
      // Nếu đã login → cập nhật UI
      document.getElementById("user-name").textContent = user.username;
      document.getElementById("user-role").textContent = user.role;
    }

    // === Đăng xuất ===
    function logout() {
      localStorage.removeItem("user");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
