<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tin nhắn — Eduground Cam</title>
<link rel="icon" href="assets/logo.png">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  :root{
    --blue:#0078d7; --bg:#f5f8fb; --panel:#ffffff; --muted:#6c757d;
  }
  body{font-family:Roboto,Segoe UI,Arial;background:var(--bg);margin:0;color:#111}
  /* ribbon */
  .nav{background:var(--blue);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
  .nav .left{display:flex;align-items:center;gap:14px}
  .nav img{height:34px;cursor:pointer}
  .nav a{color:#fff;margin:0 8px;text-decoration:none;font-weight:600}
  .nav .user{display:flex;align-items:center;gap:10px;color:#fff}
  .nav .avatar{width:36px;height:36px;border-radius:50%;background:#fff;overflow:hidden}
  .nav .avatar img{width:100%;height:100%;object-fit:cover}
  /* layout */
  .layout{display:flex;height:calc(100vh - 56px)}
  .sidebar{width:320px;background:var(--panel);border-right:1px solid #e6eef7;display:flex;flex-direction:column}
  .sidebar .top{padding:12px;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center}
  .sidebar input{flex:1;padding:8px;border-radius:6px;border:1px solid #cfdbe9}
  .sidebar .btn{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:8px 10px;cursor:pointer}
  .chat-list{overflow:auto;flex:1;padding:8px}
  .chat-item{padding:10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #f3f7fb;cursor:pointer}
  .chat-item:hover{background:#f6fbff}
  .avatar-sm{width:40px;height:40px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;color:#666}
  .meta{font-size:13px;color:var(--muted)}
  /* chat window */
  .chat-window{flex:1;display:flex;flex-direction:column;background:#eef6fb}
  .chat-header{padding:12px;border-bottom:1px solid #e5eef8;background:var(--panel);display:flex;justify-content:space-between;align-items:center}
  .chat-body{flex:1;padding:16px;overflow:auto;background:linear-gradient(#f7fbff,#eef6fb)}
  .empty-hint{color:var(--muted);text-align:center;margin-top:80px}
  .chat-footer{padding:12px;border-top:1px solid #e6eef7;background:var(--panel);display:flex;gap:8px;align-items:center}
  .chat-footer input[type="text"]{flex:1;padding:10px;border-radius:20px;border:1px solid #cfdbe9}
  .chat-footer .btn-send{background:var(--blue);color:#fff;padding:8px 14px;border:none;border-radius:12px;cursor:pointer}
  .message{max-width:70%;padding:10px 14px;border-radius:12px;margin:8px 0;word-wrap:break-word;display:inline-block}
  .message.me{background:var(--blue);color:#fff;margin-left:auto}
  .message.other{background:#fff;border:1px solid #dceaf8;color:#111}
  .msg-meta{font-size:11px;color:var(--muted);margin-top:6px}.small{font-size:12px;color:var(--muted)}
  /* modal */
  #modal{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.35);align-items:center;justify-content:center}
  #modal .box{background:#fff;padding:18px;border-radius:10px;width:420px;max-width:95%}
  /* responsiveness */
  @media(max-width:900px){
    .sidebar{width:100%}
    .layout{flex-direction:column;height:auto}
    .chat-window{height:60vh}
  }
</style>
</head>
<body>

  <!-- RIBBON -->
  <div class="nav">
    <div class="left">
      <img src="assets/logo_index.png" alt="logo" onclick="goHome()">
      <a href="index.html">Trang chủ</a>
      <a href="messages.html">Tin nhắn</a>
      <a href="reminders.html">Reminder</a>
      <a href="soday.html">Sổ đầu bài</a>
      <a href="chatbot.html">Chatbot</a>
      <a href="meeting.html">Meeting</a>
      <a href="login.html" id="logoutLink">Đăng xuất</a>
    </div>
    <div class="user">
      <div id="welcomeText" class="small">Chào mừng, <b id="userLabel">Khách</b> 👋</div>
      <div class="avatar"><img id="userAvatar" src="assets/avatar.png" alt="avatar"></div>
    </div>
  </div>

  <!-- LAYOUT -->
  <div class="layout">
    <div class="sidebar">
      <div class="top">
        <input id="searchBox" placeholder="Tìm kiếm...">
        <button class="btn" id="createBtn" title="Tạo nhóm / nhắn riêng">+</button>
      </div>
      <div class="chat-list" id="chatList">
        <!-- groups loaded here -->
      </div>
    </div>

    <div class="chat-window">
      <div class="chat-header">
        <div id="chatTitle">Chưa chọn đoạn chat</div>
        <div>
          <button class="btn" id="manageBtn" style="display:none">Quản lý</button>
        </div>
      </div>

      <div class="chat-body" id="chatBody">
        <div class="empty-hint">Chọn đoạn chat để xem tin nhắn</div>
      </div>

      <div class="chat-footer">
        <input id="msgInput" type="text" placeholder="Nhập tin nhắn... (Enter để gửi)">
        <input id="fileInput" type="file" accept="image/*,video/*,application/pdf" style="display:none">
        <button class="btn" id="mediaBtn" title="Đính kèm media">+ media</button>
        <button class="btn-send" id="sendBtn">Gửi</button>
      </div>
    </div>
  </div>

  <!-- modal create -->
  <div id="modal">
    <div class="box">
      <h3>Tạo nhóm / Nhắn riêng</h3>
      <input id="gName" placeholder="Tên nhóm / tên riêng" style="width:100%;padding:8px;margin-top:8px;border:1px solid #ddd;border-radius:6px">
      <div style="height:8px"></div>
      <input id="gMembers" placeholder="Thành viên (phân tách bằng ,)" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px">
      <div style="height:12px"></div>
      <div class="small">Ghi chú: với tin nhắn riêng, đặt tên trùng username người nhận.</div>
      <div style="height:12px"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button class="btn" id="doCreate">Tạo</button><button id="doCancel">Huỷ</button>
      </div>
      <div id="modalPreview" style="margin-top:10px"></div>
    </div>
  </div>

<!-- load auth first -->
<script src="js/auth.js"></script>

<script>
/* ===== CONFIG ===== */
const API_ROOT = ''; // same origin -> /api/*
const USER = sessionStorage.getItem('username') || localStorage.getItem('edu_remember') || 'Khách';
const ROLE = sessionStorage.getItem('role') || localStorage.getItem('edu_role') || 'student';
document.getElementById('userLabel').textContent = USER;
document.getElementById('welcomeText').innerHTML = `Chào mừng <b>${USER}</b>, chúc bạn một ngày vui vẻ 👋`;

/* role UI */
function applyRoleUI() {
  if (ROLE === 'devtool' || ROLE === 'admin' || ROLE === 'teacher') {
    document.getElementById('createBtn').style.display = 'inline-block';
  } else {
    document.getElementById('createBtn').style.display = 'none';
  }
  // manage button only for devtool / admin
  if (ROLE === 'devtool' || ROLE === 'admin') {
    document.getElementById('manageBtn').style.display = 'inline-block';
  } else {
    document.getElementById('manageBtn').style.display = 'none';
  }
}
applyRoleUI();

/* ===== STATE ===== */
let groups = {};       // id -> group obj
let active = null;     // active group id
let messagesCache = {}; // room -> array of messages
let pendingMedia = null;

/* ===== HELPERS ===== */
function goHome(){ location.href='index.html' }
function escapeHtml(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function el(tag, cls){ const d=document.createElement(tag); if(cls) d.className=cls; return d; }

/* ===== LOAD GROUPS ===== */
async function loadGroups(){
  try{
    const res = await fetch(API_ROOT + '/api/groups');
    if(res.ok){
      const data = await res.json();
      // groups may be object with ids
      groups = data || {};
    } else {
      // fallback to static groups.json
      const r2 = await fetch('groups.json');
      groups = await r2.json();
    }
  }catch(e){
    try{
      const r2 = await fetch('groups.json');
      groups = await r2.json();
    }catch(err){
      groups = {};
    }
  }
  renderGroupList();
}

/* ===== RENDER GROUP LIST ===== */
function renderGroupList(){
  const list = document.getElementById('chatList'); list.innerHTML='';
  // groups object -> show in insertion order
  try{
    Object.keys(groups).forEach(id=>{
      const g = groups[id] || {};
      const div = el('div','chat-item');
      div.onclick = ()=> openChat(id,g);
      const av = el('div','avatar-sm'); av.textContent = (g.name || id)[0] || 'G';
      const cont = el('div');
      cont.innerHTML = `<div style="font-weight:600;color:${ (g.name? 'var(--blue)' : '#000') }">${escapeHtml(g.name || id)}</div>
        <div class="meta">${(g.members||[]).slice(0,4).map(escapeHtml).join(', ')}</div>`;
      div.appendChild(av); div.appendChild(cont);
      list.appendChild(div);
    });
  }catch(e){
    // groups not object? possibly array -> handle
    if(Array.isArray(groups)){
      groups.forEach(g=>{
        const id = g.id || g.name || Math.random().toString(36).slice(2,8);
        const div = el('div','chat-item'); div.onclick = ()=> openChat(id,g);
        const av = el('div','avatar-sm'); av.textContent = (g.name || id)[0] || 'G';
        const cont = el('div'); cont.innerHTML = `<div style="font-weight:600">${escapeHtml(g.name || id)}</div><div class="meta">${(g.members||[]).slice(0,4).map(escapeHtml).join(', ')}</div>`;
        div.appendChild(av); div.appendChild(cont); list.appendChild(div);
        groups[id] = g;
      });
    }
  }

  // local DMs (simple)
  const dms = JSON.parse(localStorage.getItem('local_dms')||'[]');
  dms.forEach(dm=>{
    const id = 'dm:'+dm;
    if(Object.keys(groups).includes(id)) return;
    const div = el('div','chat-item'); div.onclick = ()=> openChat(id, { name: dm, members:[dm, USER] });
    const av = el('div','avatar-sm'); av.textContent = dm[0]||'U';
    const cont = el('div'); cont.innerHTML = `<div style="font-weight:600">${escapeHtml(dm)}</div><div class="meta">Tin nhắn riêng</div>`;div.appendChild(av); div.appendChild(cont);
    list.appendChild(div);
  });
}

/* ===== OPEN CHAT ===== */
async function openChat(id, meta){
  active = id;
  document.getElementById('chatTitle').textContent = meta.name || id;
  document.getElementById('chatBody').innerHTML = '';
  // show manage button logic
  document.getElementById('manageBtn').style.display = (ROLE==='devtool' || ROLE==='admin') ? 'inline-block' : 'none';

  if(id.startsWith('dm:')){
    const peer = id.split(':')[1];
    let dms = JSON.parse(localStorage.getItem('local_dms')||'[]');
    if(!dms.includes(peer)){ dms.push(peer); localStorage.setItem('local_dms', JSON.stringify(dms)); renderGroupList(); }
    const key = 'dm_'+[peer,USER].sort().join('_');
    const arr = JSON.parse(localStorage.getItem(key)||'[]');
    if(!arr || arr.length===0){
      document.getElementById('chatBody').innerHTML = '<div class="empty-hint">Chưa có tin nhắn riêng.</div>';
    } else {
      arr.forEach(a=> appendMessageToUI(a));
    }
  } else {
    await loadMessagesForRoom(id);
  }
}

/* ===== LOAD MESSAGES FOR ROOM ===== */
async function loadMessagesForRoom(room){
  try{
    const res = await fetch(API_ROOT + '/api/messages');
    if(!res.ok) throw new Error('no msgs');
    const data = await res.json();
    const arr = data[room] || [];
    messagesCache[room] = arr;
    document.getElementById('chatBody').innerHTML = '';
    if(!arr || arr.length===0){
      document.getElementById('chatBody').innerHTML = '<div class="empty-hint">Không có tin nhắn trong đoạn chat này.</div>';
    } else {
      arr.forEach(m => appendMessageToUI(m));
    }
  }catch(e){
    // fallback: local copy
    const local = JSON.parse(localStorage.getItem('local_chat_'+room)||'[]');
    document.getElementById('chatBody').innerHTML = '';
    if(!local || local.length===0){
      document.getElementById('chatBody').innerHTML = '<div class="empty-hint">Không có tin nhắn (off-line).</div>';
    } else {
      local.forEach(m => appendMessageToUI(m));
    }
  }
}

/* ===== APPEND MESSAGE UI ===== */
function appendMessageToUI(m){
  const body = document.getElementById('chatBody');
  const wrapper = el('div');
  const isMe = (m.from === USER);
  const msg = el('div', 'message ' + (isMe? 'me':'other'));
  if(m.type === 'media'){
    if(m.media && m.media.url){
      const a = document.createElement('a');
      a.href = m.media.url; a.target='_blank'; a.textContent = 'comming soon — mở file';
      msg.appendChild(a);
    } else {
      msg.textContent = 'comming soon';
    }
  } else {
    msg.innerHTML = escapeHtml(m.text || '');
  }
  const meta = el('div','msg-meta');
  const dt = new Date((m.time||Math.floor(Date.now()/1000))*1000);
  meta.textContent = `${dt.toLocaleString()} — ${m.from || 'khách'}`;
  msg.appendChild(meta);
  wrapper.appendChild(msg);
  body.appendChild(wrapper);
  body.scrollTop = body.scrollHeight;
}

/* ===== SEND MESSAGE ===== */
document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('msgInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendMessage(); });

async function sendMessage(){
  const text = document.getElementById('msgInput').value.trim();
  if(!active){ alert('Chưa chọn đoạn chat'); return; }
  if(!text && !pendingMedia) return;

  const payload = {
    chat_id: active,
    from: USER,
    text: text,
    type: pendingMedia? 'media' : 'text',
    time: Math.floor(Date.now()/1000)
  };

  if(pendingMedia){
    payload.media = pendingMedia; // { url, name, mediaType }
    pendingMedia = null;
    // clear preview if any
    const mp = document.getElementById('modalPreview'); if(mp) mp.innerHTML = '';
  }

  // optimistic UI
  appendMessageToUI(payload);

  try{
    if(active.startsWith('dm:')){
      const peer = active.split(':')[1];
      const key = 'dm_'+[peer,USER].sort().join('_');
      const arr = JSON.parse(localStorage.getItem(key)||'[]');
      arr.push(payload);
      localStorage.setItem(key, JSON.stringify(arr));
      // also attempt to push to server under a room name for sync (best-effort)
      const roomName = 'dmroom_' + [peer,USER].sort().join('_');
      await fetch(API_ROOT + '/api/messages', {
        method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...payload, chat_id: roomName})
      }).catch(()=>{ /* ignore */ });
    } else {
      const res = await fetch(API_ROOT + '/api/messages', {
        method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error('send fail');
      // refresh messages
      await loadMessagesForRoom(active);
    }
  }catch(err){
    alert('Gửi thất bại: ' + (err.message || err));
  } finally {
    document.getElementById('msgInput').value = '';
    // remove the waiting nodes (if any)
    // already appended optimistically above
  }
}

/* ===== MEDIA UPLOAD ===== */
document.getElementById('mediaBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', async (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  if(f.size > 16*1024*1024){ if(!confirm('File lớn hơn 16MB — tiếp tục?')) return; }
  // upload to server
  try{
    const fd = new FormData();
    fd.append('file', f);
    const r = await fetch(API_ROOT + '/api/upload', { method:'POST', body: fd });
    if(!r.ok) throw new Error('upload fail');
    const j = await r.json();
    if(j.ok){
      pendingMedia = { url: j.url, name: j.name, mediaType: f.type };
      const pr = document.getElementById('modalPreview'); if(pr) pr.innerHTML = `<div class="small">Đính kèm: ${escapeHtml(j.name)}</div>`;
      alert('Tải lên xong, tin nhắn sẽ kèm file khi gửi.');
    } else {
      alert('Upload lỗi: ' + (j.error || 'unknown'));
    }
  }catch(err){
    alert('Upload thất bại: ' + (err.message||err));
  }
});

/* ===== CREATE GROUP MODAL ===== */
const modal = document.getElementById('modal');
document.getElementById('createBtn').addEventListener('click', ()=> {
  if(!(ROLE === 'teacher' || ROLE === 'admin' || ROLE === 'devtool')) { alert('Chỉ giáo viên/adm mới được tạo nhóm'); return; }
  modal.style.display = 'flex';
});
document.getElementById('doCancel').addEventListener('click', ()=> { modal.style.display='none'; });
document.getElementById('doCreate').addEventListener('click', async ()=>{
  const name = document.getElementById('gName').value.trim();
  const membersRaw = document.getElementById('gMembers').value.trim();
  if(!name || !membersRaw){ alert('Cần tên nhóm và thành viên'); return; }
  const members = membersRaw.split(',').map(s=>s.trim()).filter(Boolean);
  const gid = 'g_' + Math.random().toString(36).slice(2,9);
  const gobj = { id: gid, name: name, members: members };
  // try server
  try{
    const res = await fetch(API_ROOT + '/api/groups', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(gobj) });
    if(res.ok){
      const j = await res.json();
      // server should return id
      const id = j.id || gid;
      groups[id] = gobj;
      renderGroupList();
      modal.style.display='none';
      document.getElementById('gName').value=''; document.getElementById('gMembers').value='';
      alert('Tạo nhóm thành công');
      return;
    }
  }catch(e){
    // ignore and fallback
  }
  // fallback local
  groups[gid] = gobj;
  renderGroupList();
  modal.style.display='none';
  alert('Tạo nhóm (offline) xong');
});

/* ===== UPDATE GROUP (manage) ===== */
async function updateGroup(id, g){
  try{
    const r = await fetch(API_ROOT + '/api/groups', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...g, id})});
    if(r.ok){ groups[id]=g; renderGroupList(); alert('Cập nhật xong'); return true; }
  }catch(e){}
  return false;
}

/* ===== SEARCH ===== */
document.getElementById('searchBox').addEventListener('input', function(){
  const q = this.value.trim().toLowerCase();
  const listItems = Array.from(document.querySelectorAll('#chatList .chat-item'));
  listItems.forEach(item=>{
    const txt = item.textContent.toLowerCase();
    item.style.display = (!q || txt.includes(q)) ? '' : 'none';
  });
});

/* ===== POLLING ===== */
setInterval(()=>{ if(active && !active.startsWith('dm:')) loadMessagesForRoom(active); }, 4000);

/* ===== INIT ===== */
loadGroups();

// call ensureAuth if available (auth.js should provide it)
if(typeof ensureAuth === 'function'){
  try{ ensureAuth(); }catch(e){ console.warn('ensureAuth failed', e); }
}
</script>
</body>
</html>
