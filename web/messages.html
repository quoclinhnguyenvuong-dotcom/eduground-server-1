<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin nhắn - EduGround</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #f3f4f6; }
    header {
      background: #2563eb; color: white;
      padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
    }
    nav a {
      color: white; margin: 0 8px; text-decoration: none; font-weight: 500;
    }
    #container { display: flex; height: calc(100vh - 60px); }
    #chat-list {
      width: 250px; background: #fff; border-right: 1px solid #ddd;
      overflow-y: auto; padding: 10px;
    }
    #chat-area { flex: 1; background: #f9fafb; display: flex; flex-direction: column; }
    #chat-box {
      flex: 1; padding: 16px; overflow-y: auto;
    }
    #input-area {
      display: flex; padding: 10px; background: white; border-top: 1px solid #ddd;
    }
    input {
      flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
    }
    button {
      background: #2563eb; color: white; border: none;
      margin-left: 8px; padding: 8px 12px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <b>Eduground Cam</b> — Tin nhắn
      <nav>
        <a href="index.html">Trang chủ</a>
        <a href="messages.html">Tin nhắn</a>
        <a href="reminders.html">Reminder</a>
        <a href="chatbot.html">Chatbot</a>
        <a href="#" onclick="logout()">Đăng xuất</a>
      </nav>
    </div>
    <div id="welcome"></div>
  </header>

  <div id="container">
    <div id="chat-list"></div>
    <div id="chat-area">
      <div id="chat-box">Chưa chọn đoạn chat.</div>
      <div id="input-area">
        <input type="text" id="msg" placeholder="Nhập tin nhắn...">
        <button onclick="sendMsg()">Gửi</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://eduground-server-1-3.onrender.com/api";
    const user = JSON.parse(localStorage.getItem("user") || "null");
    if (!user) location.href = "login.html";
    document.getElementById("welcome").textContent =
      `Chào mừng ${user.username} (${user.role}) 👋`;

    const chatList = document.getElementById("chat-list");
    const chatBox = document.getElementById("chat-box");
    let currentGroup = null;

    async function loadGroups() {
      const res = await fetch(`${API_BASE}/groups?user=${encodeURIComponent(user.username)}`);
      const groups = await res.json();
      chatList.innerHTML = "";
      groups.forEach(g => {
        const div = document.createElement("div");
        div.textContent = g.name;
        div.style.padding = "10px";
        div.style.cursor = "pointer";
        div.onclick = () => openChat(g);
        chatList.appendChild(div);
      });
    }

    async function openChat(group) {
      currentGroup = group;
      chatBox.innerHTML = `<h3>${group.name}</h3>`;
      const res = await fetch(`${API_BASE}/messages?group_id=${group.id}`);
      const msgs = await res.json();
      msgs.forEach(m => {
        const p = document.createElement("p");
        p.textContent = `${m.sender}: ${m.text}`;
        chatBox.appendChild(p);
      });
    }

    async function sendMsg() {
      const text = document.getElementById("msg").value.trim();
      if (!text || !currentGroup) return;
      await fetch(`${API_BASE}/messages`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          group_id: currentGroup.id,
          sender: user.username,
          text,
        }),
      });
      openChat(currentGroup);
      document.getElementById("msg").value = "";
    }

    function logout() {
      localStorage.removeItem("user");
      location.href = "login.html";
    }

    loadGroups();
  </script>
</body>
</html>
